name: Tests

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            diffusers: "diffusers==0.36.0"
            hub: "huggingface_hub==0.36.0"
            transformers: "transformers==4.57.3"
          - python: "3.11"
            diffusers: "diffusers==0.36.0"
            hub: "huggingface_hub==0.36.0"
            transformers: "transformers==4.57.3"
          - python: "3.12"
            diffusers: "diffusers==0.36.0"
            hub: "huggingface_hub==0.36.0"
            transformers: "transformers==4.57.3"
          - python: "3.10"
            diffusers: "diffusers"
            hub: "huggingface_hub"
            transformers: "transformers"
          - python: "3.11"
            diffusers: "diffusers"
            hub: "huggingface_hub"
            transformers: "transformers"
          - python: "3.12"
            diffusers: "diffusers"
            hub: "huggingface_hub"
            transformers: "transformers"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "${{ matrix.diffusers }}" "${{ matrix.hub }}" "${{ matrix.transformers }}" pytest
          pip install --no-deps -e .
      - name: Test
        run: pytest -q

  security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security tools
        run: pip install bandit pip-audit
      - name: Static security scan
        run: bandit -q -r src
      - name: Dependency audit
        shell: bash
        run: |
          pip-audit -r <(printf '%s\n' \
            'diffusers>=0.36.0' \
            'packaging>=20.0' \
            'transformers>=4.57.3')
